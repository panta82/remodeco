[package]
name = "remodeco"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Review and execute file renames in your editor, with an inline terminal diff"
license = "MIT"
repository = "https://github.com/panta82/remodeco"
include = ["/src/**/*.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/ARCHITECTURE.md", "/LICENSE"]

[[bin]]
name = "remodeco"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
directories = "6.0"
fs2 = "0.4"
globset = "0.4"
hex = "0.4"
libc = "0.2"
percent-encoding = "2.3"
rand = "0.8"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shell-words = "1.1"
similar = "2.7"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = true
